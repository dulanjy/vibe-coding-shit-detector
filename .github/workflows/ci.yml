name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run package and helper tests
        run: python -m unittest discover -s tests -v
      - name: Parse JSON Schema
        run: python -m json.tool assets/audit-result.schema.json > /dev/null
